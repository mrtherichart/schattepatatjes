plugins { id 'com.android.application' }

android {
    namespace 'nl.mrtherich.schattepatatjes'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.mrtherich.schattepatatjes'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def keystorePath = System.getenv('SCHATTEPATATJES_KEYSTORE_PATH')
    def signingPassword = System.getenv('SCHATTEPATATJES_SIGNING_PASSWORD')
    signingConfigs {
        release {
            if (keystorePath && signingPassword) {
                storeFile file(keystorePath)
                storePassword signingPassword
                keyAlias 'schattepatatjes'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath && signingPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register('bundleWeb', Copy) {
    from('../../') {
        include 'index.html', 'styles.css', 'app.js', 'manifest.webmanifest'
        include 'assets/**'
    }
    into layout.buildDirectory.dir('generated/webAssets/web')
    filesMatching('index.html') {
        filter { line ->
            line.replace('<script type="module"', '<script>window.SCHATTEPATATJES_NATIVE=true;</script><script type="module"')
        }
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
tasks.named('preBuild') { dependsOn 'bundleWeb' }
