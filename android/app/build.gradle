plugins { id 'com.android.application' }

android {
    namespace 'nl.mrtherich.schattepatatjes'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.mrtherich.schattepatatjes'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.2'
        // Set -PschattepatatjesUrl=https://mrtherich.nl/sp/ during the build.
        def url = project.findProperty('schattepatatjesUrl') ?: 'https://mrtherich.nl/sp/'
        buildConfigField 'String', 'SCHATTEPATATJES_URL', '"' + url.toString().replace('"','') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
