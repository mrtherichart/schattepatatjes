name: Android test APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Install Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || sdkmanager --install 'platforms;android-36'
          test -d "$ANDROID_HOME/build-tools/36.0.0" || sdkmanager --install 'build-tools;36.0.0'
      - name: Frontend + compatibility checks
        run: |
          node --check web/app.js
          node tests/check-project.cjs
      - name: Build Kotlin debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify debug APK and embedded assets
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 24 "$APK"
          unzip -t "$APK" | tail -1
          for f in assets/index.html assets/app.js assets/styles.css assets/icon.svg; do
            unzip -l "$APK" | grep -F "$f"
          done
          ! unzip -l "$APK" | grep -Eq 'assets/(api\.php|config\.php|web-config\.php)'
      - uses: actions/upload-artifact@v4
        with:
          name: schattepatatjes-debug-not-for-updates
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
