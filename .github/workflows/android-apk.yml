name: Android APK bouwen

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gebruik privésleutel indien ingesteld
        env:
          KEYSTORE_B64: ${{ secrets.SCHATTEPATATJES_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SCHATTEPATATJES_SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/schattepatatjes"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/schattepatatjes/release.jks"
            chmod 600 "$RUNNER_TEMP/schattepatatjes/release.jks"
            echo "SCHATTEPATATJES_KEYSTORE_PATH=$RUNNER_TEMP/schattepatatjes/release.jks" >> "$GITHUB_ENV"
            echo "SCHATTEPATATJES_SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Bouw release-APK inclusief offline webinterface
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Bewaar signing-tool voor lokale ondertekening
        run: |
          tool=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
          test -s "$tool"
          cp "$tool" android/app/build/outputs/apk/release/apksigner.jar
      - name: Maak Android-build beschikbaar
        uses: actions/upload-artifact@v4
        with:
          name: schattepatatjes-android-build
          path: android/app/build/outputs/apk/release/
          if-no-files-found: error
